# p6spy 출력 설정. 애플리케이션 로거(SLF4J)로 흘려보내 로그가 한 곳에 모이게 한다.
#
# modulelist는 적지 않는다. 기본값이 P6SpyFactory + P6LogFactory인데 직접 적으면서
# 로깅 모듈(P6LogFactory)을 빠뜨리면 감싸기만 하고 아무것도 찍히지 않는다 — 실제로
# 그렇게 한 번 조용히 죽었다. 기본값을 그대로 쓰는 편이 안전하다.
driverlist=org.postgresql.Driver
appender=com.p6spy.engine.spy.appender.Slf4JLogger
logMessageFormat=com.p6spy.engine.spy.appender.MultiLineFormat
# 커밋/롤백/결과셋 행까지 찍으면 조회 한 번에 수백 줄이 된다. 실행된 문장만 남긴다.
excludecategories=info,debug,result,resultset,commit,rollback
