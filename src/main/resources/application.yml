spring:
  application:
    name: backend

  # 접속 정보는 여기 적지 않는다. 셋 중 하나가 준다.
  #   1) bootRun     — spring-boot-docker-compose가 컨테이너 값을 주입한다(기본 경로)
  #   2) 로컬 .env   — 아래 import가 읽는다. Supabase처럼 남의 DB에 붙을 때
  #   3) 환경변수    — Cloud Run(SPRING_DATASOURCE_URL 등)
  # 여기에 기본값을 남겨 두면 .env와 둘 중 어느 쪽이 이기는지 매번 확인해야 한다.
  # 값이 필요한 모양은 .env.example에 있다.
  #
  # SQL 로깅은 URL이 아니라 P6SpyConfiguration이 DataSource를 감싸서 건다.
  config:
    import: optional:file:.env[.properties]

  jpa:
    hibernate:
      # ponytail: 스키마가 아직 움직이는 중이라 update로 둔다.
      # 엔티티가 8개 다 들어와 모양이 굳으면 Flyway + validate로 바꾼다.
      ddl-auto: update
    defer-datasource-initialization: true   # data.sql을 Hibernate DDL 이후로 미룬다
    open-in-view: false          # 뷰 렌더 시점까지 세션을 열어두면 지연로딩이 컨트롤러 밖에서 터진다
    properties:
      hibernate.format_sql: false

  # 파이썬 응답과 키 표기를 맞춘다(default_floor, area_m2, footprint_local_m).
  # 이 규칙이 깨졌는지는 통합 테스트가 JSON 키를 직접 검사해서 잡는다.
  jackson:
    property-naming-strategy: SNAKE_CASE

  sql:
    init:
      mode: always
      # 지정하지 않으면 Windows 기본 코드페이지(CP949)로 읽어 한글 시드가 깨진다.
      # 실제로 "더현대 서울"이 mojibake로 들어갔다. 통합 테스트가 이름을 검사해 다시 막는다.
      encoding: UTF-8
  # data.sql이 Hibernate의 테이블 생성보다 먼저 돌지 않게 미룬다.
  # 이 줄이 없으면 ddl-auto=update와 경합해 "relation does not exist"가 난다.

# 응답 gzip. 가장 큰 수혜자는 MVT 타일이다 — protobuf라 이미 조밀할 것 같지만 실측하면
# **평균 48% 줄어든다**(원본 저장소 측정: 12개 타일 135KB → 70KB). MVT가 문자열을 값 테이블로
# 공유해도 매장명·카테고리 문자열 자체의 반복이 남아서다.
# mime-types에 MVT를 직접 적어야 한다 — 기본 목록은 text/*와 몇몇 JSON뿐이다.
server:
  compression:
    enabled: true
    min-response-size: 500
    mime-types: application/json,application/vnd.mapbox-vector-tile,application/octet-stream,text/html,text/css,application/javascript

logging:
  level:
    root: INFO
    spring: INFO
    p6spy: INFO
  pattern:
    # 파이썬 쪽(app/core/logging.py)과 같은 한 줄 stdout 포맷. Cloud Run이 그대로 수집한다.
    console: '%d{yyyy-MM-dd''T''HH:mm:ssXXX} %-5level %logger{36} %msg%n'

navigation:
  # 캐시 수명(초). 파이썬 app/core/config.py의 같은 이름 설정과 값이 같다.
  cache:
    tile-max-age: 60
    tile-versioned-max-age: 31536000
    glyph-max-age: 86400

  # 교차 출처 허용 목록. 비워 두면 개발에서는 localhost 임의 포트만, 운영(prod 프로파일)에서는
  # 전부 차단이다. 운영 배포에서는 Flutter 앱 도메인을 반드시 적는다 — 근거는 CorsConfig.
  cors:
    origins: []
