name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 통합 테스트가 Testcontainers로 PostgreSQL을 띄운다. ubuntu-latest 러너에는
      # Docker가 이미 있으므로 별도 설치가 필요 없다.
      #
      # build가 test를 포함하지만 단계를 나눈다. 컴파일에서 깨진 것과 테스트에서 깨진 것이
      # 다른 단계로 갈리면 로그를 열기 전에 실패 지점을 안다.
      - run: ./gradlew compileJava compileTestJava --no-daemon
      - run: ./gradlew test --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: build/reports/tests/test
