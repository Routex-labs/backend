plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'labs.routex'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

// 버전을 적지 않은 항목은 Spring Boot BOM이 정한다. 직접 고정하면 Boot를 올릴 때마다
// 호환을 손으로 다시 맞춰야 한다. BOM 밖 라이브러리(p6spy)만 버전을 적는다.
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 타일 바이트·리비전 캐시. 상한(바이트 수)과 만료가 필요해서 쓴다 - 상한 없는 맵은
	// 오래 사는 배포 프로세스에서 메모리가 계속 커진다. 버전은 Boot BOM이 정한다.
	implementation 'com.github.ben-manes.caffeine:caffeine'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 스키마 이관. 버전은 Boot BOM이 정한다. flyway-database-postgresql은 PG 전용
	// 방언 모듈이고, Flyway 10부터 본체와 분리돼 따로 넣지 않으면 기동 시
	// "No database found to handle jdbc:postgresql"로 죽는다.
	// Boot 4는 자동설정을 기술별 모듈로 쪼갰다. flyway-core만 넣으면 자동설정이 없어
	// 마이그레이션이 조용히 실행되지 않는다(기동은 되고 validate에서 "missing table"로
	// 터진다). spring-boot-flyway가 그 자동설정을 담고 있다.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	runtimeOnly 'org.postgresql:postgresql'
	// SQL 로깅. 바인딩된 파라미터가 값으로 찍히고 실행 시간이 붙는다.
	// 스타터(gavlyukovskiy)를 쓰지 않는 이유는 최신 1.11.0이 Boot 4보다 8개월 앞선
	// 빌드라 자동설정 호환이 보장되지 않아서다. 본체만 넣고 P6SpyConfiguration이 건다.
	implementation 'p6spy:p6spy:3.9.1'

	// 한국어 형태소 분석(Nori). Elasticsearch 기능으로 알려져 있지만 실제로는 Lucene
	// 본체의 분석기라 서버 없이 라이브러리로 쓴다 - mecab-ko-dic 기반이고 품사 태그도
	// Kiwi와 같은 체계라 파이썬의 제거 규칙(J·E·V·MM·MA·NP·XSV·XSA)이 그대로 옮겨진다.
	// 10.x는 Java 21을 요구하므로 17에서 도는 마지막 계열인 9.x로 고정한다(BOM 밖).
	implementation 'org.apache.lucene:lucene-analysis-nori:9.12.1'

	// bootRun이 compose.yaml을 자동으로 띄운다. 운영 이미지에는 들어가지 않는다.
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Windows 기본 코드페이지는 CP949다. 지정하지 않으면 javac가 한글 소스를 CP949로 읽어
// 문자열·주석이 깨지고, 테스트 이름도 콘솔에서 깨져 나온다. 세 곳 모두 UTF-8로 고정한다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << '-Xlint:deprecation'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'file.encoding', 'UTF-8'
	testLogging {
		events 'passed', 'failed', 'skipped'
		exceptionFormat 'short'
	}
}
