# 로컬 개발용 PostgreSQL. bootRun이 spring-boot-docker-compose로 자동 기동한다.
# 드라이버(BOM 관리 42.7.11)가 PG 8.4~18을 지원하므로 현재 stable인 18로 고정한다.
# latest를 쓰면 어느 날 메이저가 올라가 재현이 깨진다.
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=navigation'
      - 'POSTGRES_USER=navigation'
      - 'POSTGRES_PASSWORD=navigation'
    ports:
      - '5432:5432'
